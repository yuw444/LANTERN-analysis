# This workflow lives on the `tooling` branch only: Bioconductor requires
# the default branch (devel) to contain only package code. To check / rebuild
# the site against the latest package: git checkout tooling && git merge devel
# && git push.
on:
  push:
    branches: [tooling]
  workflow_dispatch:

name: pkgdown

concurrency:
  group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libhdf5-dev libbz2-dev liblzma-dev bcftools

      # pak (via setup-r-dependencies below) intermittently fails to install
      # Rhtslib after building it from source ("Failed to install binary
      # package Rhtslib") — a known upstream pak issue. Installing
      # SeqArray/SeqVarTools with BiocManager first (plain install.packages(),
      # no pak) avoids that code path; pak then sees them already satisfied.
      - name: Install Bioconductor dependencies
        run: |
          Rscript -e 'if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager")'
          Rscript -e 'BiocManager::install(c("SeqArray", "SeqVarTools", "BiocStyle"), ask = FALSE, update = FALSE)'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: '.'
          extra-packages: |
            any::pkgdown
            any::knitr
            any::rmarkdown

      - name: Install lantern package
        run: R CMD INSTALL .

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)'

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
